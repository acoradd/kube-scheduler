name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.35.9" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.36.5" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.37.1" # renovate: datasource=go depName=k8s.io/kubernetes
    name: test (k8s ${{ matrix.k8s }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: bash hack/set-k8s-version.sh ${{ matrix.k8s }}
      - working-directory: src
        run: go build ./...
      - working-directory: src
        run: go vet ./...
      - working-directory: src
        run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.35.9" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.36.5" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.37.1" # renovate: datasource=go depName=k8s.io/kubernetes
    name: lint (k8s ${{ matrix.k8s }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: bash hack/set-k8s-version.sh ${{ matrix.k8s }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: src

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.35.9" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.36.5" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.37.1" # renovate: datasource=go depName=k8s.io/kubernetes
    name: docker-build (k8s ${{ matrix.k8s }})
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: K8S_VERSION=${{ matrix.k8s }}
          push: false
