name: release

# Released versions are v<k8s minor>.<VERSION>.<k8s patch>, e.g. v35.1.9 is
# release 1 of this project built against Kubernetes 1.35.9:
# - VERSION is bumped by hand for every change worth releasing (feature or fix);
# - the patch follows the Kubernetes libraries, so a Renovate patch bump of a
#   matrix entry releases that entry automatically once merged.
# Every push to main releases the versions that are not tagged yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.35.9" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.36.5" # renovate: datasource=go depName=k8s.io/kubernetes
          - "1.37.1" # renovate: datasource=go depName=k8s.io/kubernetes
    name: image (k8s ${{ matrix.k8s }})
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          k8s='${{ matrix.k8s }}'
          minor="${k8s#1.}"; minor="${minor%%.*}"
          release="$(tr -d '[:space:]' < VERSION)"
          version="${minor}.${release}.${k8s##*.}"
          {
            echo "major=${minor}"
            echo "minor=${minor}.${release}"
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "v${version} already released, skipping"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.released != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.version.outputs.released != 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.version.outputs.released != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.released != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}

      - if: steps.version.outputs.released != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: K8S_VERSION=${{ matrix.k8s }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Tagging comes last so a failed image push is retried on the next run.
      - if: steps.version.outputs.released != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Built against Kubernetes ${{ matrix.k8s }}.

            ```
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```
          generate_release_notes: true
